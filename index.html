<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Inventario de Bodega</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Saira:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">
  <header>
    <h1>Inventario de Bodega <span id="syncdot"></span><span id="modo"></span></h1>
    <div class="sub"><span>Núcleos · Partes · Trazabilidad</span>
      <button id="usuario-chip" onclick="cambiarUsuario()">👤 —</button></div>
    <div id="searchwrap">
      <input id="search" placeholder="Buscar ID, modelo, ubicación…">
      <button id="recargar" title="Traer cambios de otros teléfonos">⟳</button>
    </div>
  </header>

  <!-- BLOQUE DE FILTROS — se actualiza según la pestaña activa -->
  <div id="filtros-wrap"></div>

  <main id="vista"></main>

  <button id="fab" title="Agregar">+</button>

  <nav>
    <button data-tab="nucleos" class="on"><span class="ic">⚙</span>Núcleos</button>
    <button data-tab="partes"><span class="ic">🔩</span>Partes</button>
    <button data-tab="remfg"><span class="ic">🔧</span>Re-Mfg</button>
    <button data-tab="cons"><span class="ic">🏪</span>Consig.</button>
    <button data-tab="movs"><span class="ic">↔</span>Movim.</button>
    <button data-tab="resumen"><span class="ic">▦</span>Resumen</button>
  </nav>
</div>

<div id="hoja"><div class="panel" id="panel"></div></div>
<div id="visor" onclick="this.classList.remove('abierto')"><img id="visor-img"><button class="cerrar">Cerrar</button></div>
<div id="login"><div class="caja" id="login-caja"></div></div>

<!-- Overlay de confirmación de borrado -->
<div id="confirm-overlay">
  <div id="confirm-box">
    <h3 id="confirm-titulo">¿Eliminar?</h3>
    <p id="confirm-msg">Esta acción no se puede deshacer.</p>
    <div class="btns">
      <button class="cancelar" onclick="cerrarConfirm()">Cancelar</button>
      <button class="confirmar" id="confirm-ok" onclick="ejecutarConfirm()">Eliminar</button>
    </div>
  </div>
</div>

<datalist id="dl-ubic"></datalist>
<datalist id="dl-piezas">
  <option>Coplín</option><option>Corona-Piñón</option><option>Eje Principal (Mainshaft)</option>
  <option>Eje Contramarcha (Countershaft)</option><option>Carcasa Frontal</option><option>Carcasa Auxiliar</option>
  <option>Eje de Entrada (Input Shaft)</option><option>Sincronizador</option><option>Engrane</option>
  <option>Portadiferencial</option><option>Satélites y Planetarios</option>
  <option>Bomba de Aceite</option><option>Torre de Cambios</option><option>Yugo</option><option>Rodamiento</option>
  <option>Bull Gear</option><option>Atravesado</option>
</datalist>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
