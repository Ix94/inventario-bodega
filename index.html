<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Inventario de Bodega</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Saira:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --concreto:#E9E6E0; --acero:#23272C; --azul:#2B5A87; --azul-osc:#1E4265;
    --naranja:#DE5A1E; --amarillo:#F5D803; --blanco:#FFFFFF; --gris:#8A8F96;
    --ok:#2E7D46; --rojo:#B3372B; --morado:#6B3FA0; --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Saira',system-ui,sans-serif;background:var(--concreto);color:var(--acero);font-size:15px}
  /* Forzar mayúsculas en todos los campos de texto del usuario */
  input:not([type="number"]):not([type="tel"]):not([type="file"]):not([type="datetime-local"]),
  textarea { text-transform:uppercase; }
  #app{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:76px}

  header{background:var(--acero);color:var(--blanco);padding:14px 16px 12px;position:sticky;top:0;z-index:20;
    border-bottom:4px solid var(--naranja)}
  header h1{font-family:'Saira Condensed';font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
  header .sub{font-size:11px;color:#B9BEC5;letter-spacing:.14em;text-transform:uppercase;margin-top:3px;display:flex;justify-content:space-between;align-items:center}
  #usuario-chip{background:#31363D;color:var(--amarillo);border:none;border-radius:20px;padding:3px 12px;font:inherit;font-size:11px;letter-spacing:.08em;cursor:pointer}
  #syncdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gris);margin-left:6px;vertical-align:middle}
  #modo{font-size:10px;color:#B9BEC5;letter-spacing:.05em;margin-left:6px}
  #searchwrap{margin-top:10px;display:flex;gap:8px}
  #search{flex:1;padding:10px 12px;border:none;border-radius:var(--radius);font:inherit;font-size:15px;background:#31363D;color:var(--blanco);text-transform:uppercase}
  #search::placeholder{color:#8A8F96;text-transform:none}
  #recargar{border:none;background:#31363D;color:var(--amarillo);border-radius:var(--radius);width:44px;font-size:18px;cursor:pointer}

  /* ── FILTROS ── */
  #filtros-wrap{background:#1C2026;padding:8px 14px 10px;display:flex;flex-direction:column;gap:6px}
  .fila-filtro{display:flex;gap:6px;flex-wrap:wrap}
  .filtro-btn{background:#31363D;color:#9AA0A8;border:1.5px solid #3C4148;border-radius:20px;
    padding:5px 13px;font:inherit;font-size:12px;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:all .15s}
  .filtro-btn.on{background:var(--azul);color:#fff;border-color:var(--azul)}
  .filtro-btn.marca-on{background:var(--naranja);color:#fff;border-color:var(--naranja)}
  .filtro-label{font-size:10px;color:#6B7076;letter-spacing:.1em;text-transform:uppercase;align-self:center;padding-left:2px}

  main{flex:1;padding:14px 14px 20px}

  .card{background:var(--blanco);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;
    border-left:5px solid var(--azul);box-shadow:0 1px 3px rgba(0,0,0,.10)}
  .card.parte{border-left-color:var(--naranja)}
  .card.remfg{border-left-color:var(--morado)}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .card .cuerpo{display:flex;gap:12px;margin-top:6px}
  .card .info{flex:1;min-width:0}
  .foto-mini{width:74px;height:74px;object-fit:cover;border-radius:8px;border:2px solid #D7D3CB;cursor:pointer;flex-shrink:0;background:#EEE}
  .id{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;color:var(--azul-osc);letter-spacing:.02em}
  .card.parte .id{color:var(--naranja)}
  .card.remfg .id{color:var(--morado)}
  .tag{display:inline-block;background:var(--amarillo);color:#1b1b1b;font-family:'Saira Condensed';font-weight:700;
    font-size:13px;padding:2px 9px;border-radius:3px;letter-spacing:.05em;border:1px solid #C9B300;white-space:nowrap}
  .tag.remfg-tag{background:var(--morado);color:#fff;border-color:#52307A}
  .card h3{font-size:16px;font-weight:600}
  .meta{font-size:13px;color:#565B62;margin-top:2px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .chip{background:#EEF2F6;border:1px solid #D7DEE6;border-radius:4px;padding:2px 8px;font-size:12px;color:#3C4854}
  .estado{font-size:12px;font-weight:600;margin-top:6px}
  .estado.dispo{color:var(--ok)} .estado.desm{color:var(--naranja)} .estado.scrap{color:var(--rojo)}
  .estado.remfg-est{color:var(--morado)}
  .acciones{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .acciones button{flex:1;min-width:90px;padding:9px 6px;border:1.5px solid var(--azul);background:transparent;color:var(--azul);
    border-radius:7px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .acciones button.warn{border-color:var(--naranja);color:var(--naranja)}
  .acciones button.morado{border-color:var(--morado);color:var(--morado)}
  .acciones button.peligro{border-color:#C9CDD2;color:var(--gris);flex:0;min-width:44px}
  .acciones button.peligro-sup{border-color:var(--rojo);color:var(--rojo);flex:0;min-width:44px}
  .acciones button:active{transform:scale(.97)}

  .vacio{text-align:center;color:#6B7076;padding:44px 20px}
  .vacio b{display:block;font-family:'Saira Condensed';font-size:20px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;color:#4A4F55}
  .aviso{background:#FFF4E2;border:1.5px solid #E8B36A;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:12px;color:#6B4A12}
  .aviso-morado{background:#F3EEF9;border:1.5px solid #9B59D0;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:12px;color:#4A2080}

  nav{position:fixed;bottom:0;left:0;right:0;background:var(--acero);display:flex;z-index:30;
    border-top:3px solid var(--azul);max-width:760px;margin:0 auto}
  nav button{flex:1;background:none;border:none;color:#9AA0A8;padding:10px 2px 12px;font-family:'Saira Condensed';
    font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  nav button.on{color:var(--amarillo)}
  nav button .ic{display:block;font-size:17px;margin-bottom:2px}

  #fab{position:fixed;right:16px;bottom:86px;width:58px;height:58px;border-radius:50%;background:var(--naranja);
    color:#fff;border:none;font-size:30px;line-height:1;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:25}
  #fab:active{transform:scale(.94)}

  #hoja{position:fixed;inset:0;background:rgba(20,22,25,.55);display:none;z-index:40;overflow-y:auto}
  #hoja.abierta{display:block}
  #hoja .panel{background:var(--concreto);max-width:760px;margin:24px auto 0;min-height:calc(100vh - 24px);
    border-radius:14px 14px 0 0;padding:16px 16px 40px}
  #hoja h2{font-family:'Saira Condensed';font-size:20px;text-transform:uppercase;letter-spacing:.05em;
    border-bottom:3px solid var(--naranja);padding-bottom:8px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
  #hoja h2 .x{border:none;background:#D8D4CC;border-radius:7px;width:34px;height:34px;font-size:17px;cursor:pointer}
  label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:#4A4F55;margin:12px 0 4px}
  input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid #C6C2BA;border-radius:8px;font:inherit;font-size:15px;background:var(--blanco)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--azul);border-color:var(--azul)}
  .fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fila3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .carbloque{background:#DFDBD3;border-radius:10px;padding:10px 12px 14px;margin-top:14px}
  .carbloque .titulo{font-family:'Saira Condensed';font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#3C4148}
  .carfila{display:grid;grid-template-columns:5fr 6fr;gap:8px;margin-top:8px}
  .carfila input{padding:9px 10px;font-size:14px}
  .guardar{width:100%;margin-top:20px;padding:15px;background:var(--azul);color:#fff;border:none;border-radius:10px;
    font-family:'Saira Condensed';font-size:17px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
  .guardar:disabled{background:#8A9AAB}
  .guardar:active{transform:scale(.98)}
  .guardar.morado{background:var(--morado)}
  .nota-origen{background:var(--amarillo);border-radius:6px;padding:8px 12px;font-size:13px;font-weight:600;margin-top:10px}
  .nota-remfg{background:#EDE5F7;border:1.5px solid var(--morado);border-radius:6px;padding:8px 12px;font-size:13px;font-weight:600;margin-top:10px;color:#4A2080}

  /* campos especiales de coplín */
  .bloque-especial{background:#E8F0F8;border:1.5px solid #B0C8E0;border-radius:10px;padding:12px;margin-top:12px}
  .bloque-especial .titulo{font-family:'Saira Condensed';font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--azul-osc);margin-bottom:8px}
  .bloque-especial input,.bloque-especial select{background:#fff}

  /* modelos compatibles multiselect */
  .modelos-wrap{background:#F5F3EF;border:1.5px solid #C6C2BA;border-radius:8px;padding:8px;margin-top:4px;max-height:130px;overflow-y:auto}
  .modelos-wrap label{margin:0;font-size:13px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--acero);display:flex;align-items:center;gap:6px;padding:3px 0;cursor:pointer}
  .modelos-wrap input[type=checkbox]{width:auto;padding:0;margin:0}
  .modelos-add{display:flex;gap:6px;margin-top:6px}
  .modelos-add input{flex:1;padding:7px 10px;font-size:13px}
  .modelos-add button{padding:7px 12px;background:var(--azul);color:#fff;border:none;border-radius:6px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}

  /* foto en formulario */
  .fotozona{margin-top:14px;display:flex;gap:10px;align-items:center}
  .fotobtn{flex:1;padding:13px;border:2px dashed var(--azul);border-radius:10px;background:#F3F6F9;color:var(--azul);
    font:inherit;font-weight:600;font-size:14px;cursor:pointer;text-align:center}
  .foto-prev{width:84px;height:84px;object-fit:cover;border-radius:10px;border:2px solid var(--azul);display:none}

  /* visor de foto */
  #visor{position:fixed;inset:0;background:rgba(10,11,13,.92);display:none;z-index:60;align-items:center;justify-content:center;flex-direction:column;padding:16px}
  #visor.abierto{display:flex}
  #visor img{max-width:100%;max-height:82vh;border-radius:8px}
  #visor .cerrar{margin-top:14px;background:var(--amarillo);border:none;border-radius:8px;padding:10px 28px;
    font-family:'Saira Condensed';font-weight:700;font-size:15px;letter-spacing:.08em;cursor:pointer}

  /* pantalla de usuario */
  #login{position:fixed;inset:0;background:var(--acero);z-index:70;display:none;overflow-y:auto}
  #login.abierto{display:block}
  #login .caja{max-width:420px;margin:0 auto;padding:40px 22px}
  #login h2{font-family:'Saira Condensed';color:var(--blanco);font-size:26px;text-transform:uppercase;letter-spacing:.06em;border-bottom:4px solid var(--naranja);padding-bottom:10px}
  #login p{color:#B9BEC5;font-size:13px;margin:10px 0 18px}
  .ubtn{display:block;width:100%;background:#31363D;color:var(--blanco);border:none;border-radius:10px;padding:15px;
    font:inherit;font-size:16px;font-weight:600;text-align:left;margin-bottom:10px;cursor:pointer}
  .ubtn:active{background:#3C4148}
  .ubtn .ini{display:inline-block;width:34px;height:34px;background:var(--azul);border-radius:50%;text-align:center;line-height:34px;margin-right:12px;font-family:'Saira Condensed';font-weight:700}
  .ubtn .rol-chip{float:right;font-size:11px;background:#23272C;padding:2px 8px;border-radius:10px;margin-top:2px}
  .rol-admin{color:var(--amarillo)} .rol-sup{color:#7EC8FF} .rol-op{color:#9AA0A8}
  #login label{color:#B9BEC5}
  #login input{background:#31363D;border-color:#4A4F55;color:var(--blanco)}
  #login .guardar{background:var(--naranja)}

  /* confirmación de borrado */
  #confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
  #confirm-overlay.abierto{display:flex}
  #confirm-box{background:var(--blanco);border-radius:14px;padding:22px 20px;max-width:380px;width:100%;text-align:center}
  #confirm-box h3{font-family:'Saira Condensed';font-size:18px;text-transform:uppercase;color:var(--rojo);margin-bottom:10px}
  #confirm-box p{font-size:14px;color:#4A4F55;margin-bottom:16px;line-height:1.5}
  #confirm-box .btns{display:flex;gap:10px}
  #confirm-box .btns button{flex:1;padding:12px;border:none;border-radius:8px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
  #confirm-box .btns .cancelar{background:#EEE;color:var(--acero)}
  #confirm-box .btns .confirmar{background:var(--rojo);color:#fff}

  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{background:var(--blanco);border-radius:var(--radius);padding:14px;border-top:4px solid var(--azul)}
  .kpi.n2{border-top-color:var(--naranja)} .kpi.n3{border-top-color:var(--morado)}
  .kpi .num{font-family:'Saira Condensed';font-size:32px;font-weight:700;line-height:1}
  .kpi .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:#565B62;margin-top:4px}
  .exportar{width:100%;margin-top:14px;padding:13px;background:var(--acero);color:var(--amarillo);border:none;border-radius:10px;
    font-family:'Saira Condensed';font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
  .mov{background:var(--blanco);border-radius:8px;padding:9px 12px;margin-bottom:7px;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .mov .f{color:#7A7F86;font-size:11px}
  .seccion-t{font-family:'Saira Condensed';font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:18px 0 8px;color:#3C4148}
  @media (min-width:600px){ .kpis{grid-template-columns:repeat(4,1fr)} }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>Inventario de Bodega <span id="syncdot"></span><span id="modo"></span></h1>
    <div class="sub"><span>Núcleos · Partes · Trazabilidad</span>
      <button id="usuario-chip" onclick="cambiarUsuario()">👤 —</button></div>
    <div id="searchwrap">
      <input id="search" placeholder="Buscar ID, modelo, ubicación…">
      <button id="recargar" title="Traer cambios de otros teléfonos">⟳</button>
    </div>
  </header>

  <!-- BLOQUE DE FILTROS — se actualiza según la pestaña activa -->
  <div id="filtros-wrap"></div>

  <main id="vista"></main>

  <button id="fab" title="Agregar">+</button>

  <nav>
    <button data-tab="nucleos" class="on"><span class="ic">⚙</span>Núcleos</button>
    <button data-tab="partes"><span class="ic">🔩</span>Partes</button>
    <button data-tab="remfg"><span class="ic">🔧</span>Re-Mfg</button>
    <button data-tab="movs"><span class="ic">↔</span>Movim.</button>
    <button data-tab="resumen"><span class="ic">▦</span>Resumen</button>
  </nav>
</div>

<div id="hoja"><div class="panel" id="panel"></div></div>
<div id="visor" onclick="this.classList.remove('abierto')"><img id="visor-img"><button class="cerrar">Cerrar</button></div>
<div id="login"><div class="caja" id="login-caja"></div></div>

<!-- Overlay de confirmación de borrado -->
<div id="confirm-overlay">
  <div id="confirm-box">
    <h3 id="confirm-titulo">¿Eliminar?</h3>
    <p id="confirm-msg">Esta acción no se puede deshacer.</p>
    <div class="btns">
      <button class="cancelar" onclick="cerrarConfirm()">Cancelar</button>
      <button class="confirmar" id="confirm-ok">Eliminar</button>
    </div>
  </div>
</div>

<datalist id="dl-ubic"></datalist>
<datalist id="dl-piezas">
  <option>Coplín</option><option>Corona-Piñón</option><option>Eje Principal (Mainshaft)</option>
  <option>Eje Contramarcha (Countershaft)</option><option>Carcasa Frontal</option><option>Carcasa Auxiliar</option>
  <option>Eje de Entrada (Input Shaft)</option><option>Sincronizador</option><option>Engrane</option>
  <option>Portadiferencial</option><option>Satélites y Planetarios</option>
  <option>Bomba de Aceite</option><option>Torre de Cambios</option><option>Yugo</option><option>Rodamiento</option>
  <option>Bull Gear</option><option>Atravesado</option>
</datalist>

/* =====================================================================
   GENERACIÓN DE IDs — secuencial real
   
   Estrategia:
   1. Si hay Supabase: consulta el máximo número real de la BD antes de
      insertar para evitar colisiones entre usuarios concurrentes.
   2. Si no hay Supabase (modo local): usa el array D local.
   3. El formato es limpio y secuencial: PRT-0339, PRT-0340, etc.
      Sin sufijos de timestamp que rompen la legibilidad y la secuencia.
   4. Para el caso de colisión real (dos usuarios literalmente al mismo
      milisegundo), Supabase rechazará el segundo upsert con error de
      clave duplicada — el sistema reintentará con +1 automáticamente.
   ===================================================================== */

/* Extrae el número secuencial del ID dado un prefijo */
function extraerNum(id, pref){
  const m = String(id||'').match(new RegExp('^' + pref + '-(\\d+)'));
  return m ? parseInt(m[1], 10) : 0;
}

/* Calcula el máximo local en D.partes o D.nucleos */
function maxLocal(pref, lista){
  let max = 0;
  for(const o of lista) max = Math.max(max, extraerNum(o.id, pref));
  return max;
}

/* Consulta el máximo real a Supabase para el prefijo dado.
   Filtra por col='parte' o col='nucleo' según prefijo. */
async function maxSupabase(pref){
  if(!sb) return 0;
  const col = (pref==='TR'||pref==='DF') ? 'nucleo' : 'parte';
  try{
    // Traer solo los IDs de esa colección, ordenados descendentemente por id
    const { data, error } = await sb
      .from('bodega')
      .select('id')
      .eq('col', col)
      .like('id', pref + '-%')
      .order('id', { ascending: false })
      .limit(5);   // solo necesitamos los más altos
    if(error || !data || !data.length) return 0;
    return Math.max(...data.map(r => extraerNum(r.id, pref)));
  }catch(e){ return 0; }
}

/* Genera el siguiente ID de parte. async porque consulta Supabase. */
async function generarIdParte(){
  const pref = 'PRT';
  const local = maxLocal(pref, D.partes);
  const remoto = await maxSupabase(pref);
  const siguiente = Math.max(local, remoto) + 1;
  return `${pref}-${String(siguiente).padStart(4,'0')}`;
}

/* Genera el siguiente ID de núcleo. async porque consulta Supabase.
   Formato: TR-2026-08-0042  (prefijo-año-mes-secuencia del mes) */
async function generarIdNucleo(tipo){
  const pref = tipo==='Transmisión' ? 'TR' : 'DF';
  const mes = hoy().slice(0,7);   // "2026-08"
  /* Máximo local del mes actual */
  let localMax = 0;
  D.nucleos.forEach(n=>{
    if(String(n.id).startsWith(`${pref}-${mes}-`))
      localMax = Math.max(localMax, extraerNum(n.id.replace(`${pref}-${mes}-`,''), ''));
  });
  /* Máximo remoto del mes actual */
  let remotoMax = 0;
  if(sb){
    try{
      const { data } = await sb
        .from('bodega').select('id').eq('col','nucleo')
        .like('id', `${pref}-${mes}-%`)
        .order('id',{ascending:false}).limit(5);
      if(data && data.length){
        remotoMax = Math.max(...data.map(r=>{
          const partes = String(r.id).split('-');
          return parseInt(partes[partes.length-1],10)||0;
        }));
      }
    }catch(e){}
  }
  const siguiente = Math.max(localMax, remotoMax) + 1;
  return `${pref}-${mes}-${String(siguiente).padStart(4,'0')}`;
}

   ===================================================================== */
function comprimirFoto(file){
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = ()=>{
      const MAX = 1280; let w = img.width, h = img.height;
      if(w>h && w>MAX){ h=h*MAX/w; w=MAX; } else if(h>=w && h>MAX){ w=w*MAX/h; h=MAX; }
      const c = document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=>b?res({blob:b,dataUrl:c.toDataURL('image/jpeg',.72)}):rej('sin blob'),'image/jpeg',.72);
    };
    img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}
async function subirFoto(id){
  if(!fotoPend) return '';
  if(!sb) return fotoPend.dataUrl;
  const ruta = `${id}_${Date.now()}.jpg`;
  const { error } = await sb.storage.from('fotos').upload(ruta, fotoPend.blob, {contentType:'image/jpeg'});
  if(error){ alert('La foto no se pudo subir. El registro se guardará sin foto; edítalo luego para agregarla.'); return ''; }
  return sb.storage.from('fotos').getPublicUrl(ruta).data.publicUrl;
}

/* =====================================================================
   FILTROS — lógica de filtrado
   ===================================================================== */
function marcaCoincide(marcaRegistro, filtroCabeza){
  if(!filtroCabeza) return true;
  const sub = MARCAS_MAPA[filtroCabeza] || [];
  const mr = mayus(marcaRegistro||'');
  return sub.some(s => mr.includes(s));
}

function coincideNucleo(n){
  if(F.tipo && n.tipo !== F.tipo) return false;
  if(F.posicion){
    const cars = (n.cars||[]).map(c=>mayus(c.v||''));
    const notas = mayus(n.notas||'');
    const posStr = F.posicion.toUpperCase();
    if(!cars.some(v=>v.includes(posStr)) && !notas.includes(posStr)) return false;
  }
  if(F.marca && !marcaCoincide(n.marca, F.marca)) return false;
  if(filtro && !JSON.stringify(n).toUpperCase().includes(filtro)) return false;
  return true;
}
function coincideParte(p){
  if(F.parteTipo && !mayus(p.tipo||'').includes(F.parteTipo.toUpperCase())) return false;
  const cars = p.cars||[];
  if(F.car1 && !mayus(cars[0]?.v||'').includes(F.car1.toUpperCase())) return false;
  if(F.car2 && !mayus(cars[1]?.v||'').includes(F.car2.toUpperCase())) return false;
  if(F.car3 && !mayus(cars[2]?.v||'').includes(F.car3.toUpperCase())) return false;
  if(filtro && !JSON.stringify(p).toUpperCase().includes(filtro)) return false;
  return true;
}

function cargarMack(data){

}

function formNucleo(editId){
  const e = editId ? D.nucleos.find(x=>x.id===editId) : null;
  abrirHoja(`
    <h2>${e ? 'EDITAR '+esc(e.id) : 'NUEVO NÚCLEO'} <button class="x" onclick="cerrarHoja()">✕</button></h2>
    ${bloqueFoto()}

    </select>

    <div class="fila2">
      <div><label>Marca</label><input id="f-marca" placeholder="EATON, ROCKWELL, MACK…" oninput="onMarcaCambio()"></div>
      <div><label>Modelo</label><input id="f-modelo" placeholder="FRO-15210C"></div>
    </div>
    <div class="fila2">
      <div><label>Posición</label>
        <select id="f-posicion"><option value="">— Sin especificar —</option><option>Delantero</option><option>Trasero</option></select>
        <!-- opciones se actualizan con actualizarOpcionesPosicion() -->
      </div>
      <div><label>N° serie</label><input id="f-serie"></div>
    </div>
    <label>Ubicación / estante</label><input id="f-ubic" list="dl-ubic" placeholder="A20, TRI-01…">
    <label>Fecha de ingreso</label>
    <input type="datetime-local" id="f-fecha" value="${ahoraLocal()}">
    <label>Estado visual</label><input id="f-estado" placeholder="CORROSIÓN LEVE, CARCASA ÍNTEGRA…">
    ${bloqueMack()}
    ${camposCars(SUG['Transmisión'])}
    <label>Notas</label><textarea id="f-notas" rows="2"></textarea>
    <button class="guardar" id="btn-g" onclick="guardarNucleo(this,'${editId||''}')">${e ? 'Guardar cambios' : 'Guardar núcleo'}</button>`);

  /* Ajustar opciones de posición y ocultar MACK por defecto */
  actualizarOpcionesPosicion();
  $('#bloque-mack').style.display='none';

  if(e){
    $('#f-tipo').value = e.tipo||'Transmisión';
    actualizarOpcionesPosicion();   // ajustar opciones antes de asignar valor guardado
    $('#f-marca').value = e.marca||''; $('#f-modelo').value = e.modelo||'';
    $('#f-posicion').value = e.posicion||''; $('#f-serie').value = e.serie||'';
    $('#f-ubic').value = e.ubic||''; $('#f-estado').value = e.estado||'';
    $('#f-notas').value = e.notas||'';
    if(e.fecha) $('#f-fecha').value = e.fecha.length===10 ? e.fecha+'T00:00' : e.fecha;
    [0,1,2,3,4].forEach(i=>{ $('#cn'+i).value=''; $('#cv'+i).value=''; });
    (e.cars||[]).slice(0,5).forEach((c,i)=>{ $('#cn'+i).value=c.n||''; $('#cv'+i).value=c.v||''; });
    if(e.foto){ const p=$('#foto-prev'); p.src=e.foto; p.style.display='block'; $('#fotobtn-txt').textContent='✓ Ya tiene foto — tocar para cambiar'; }
    onMarcaCambio();
    if(e.mack) cargarMack(e.mack);
  }
}
/* Opciones de Posición según tipo:
   Diferencial  → Delantero | Trasero
   Transmisión  → Delantera | Trasera | Intermedia (posición de palanca) */
function actualizarOpcionesPosicion(){
  const sel = $('#f-posicion'); if(!sel) return;
  const tipo = $('#f-tipo')?.value||'Transmisión';
  const actual = sel.value;
  if(tipo==='Diferencial'){
    sel.innerHTML = `<option value="">— Sin especificar —</option>
      <option>Delantero</option><option>Trasero</option>`;
  } else {
    sel.innerHTML = `<option value="">— Sin especificar —</option>
      <option>Delantera</option><option>Trasera</option><option>Intermedia</option>`;
  }
  /* Restaurar valor si todavía aplica */
  if([...sel.options].some(o=>o.value===actual)) sel.value=actual;
}

function ponSugNucleo(){
  const t = $('#f-tipo')?.value||'Transmisión';
  ponSug(t);
  actualizarOpcionesPosicion();
  onMarcaCambio();
}
async function guardarNucleo(btn, editId){
  btn.disabled=true; btn.textContent='Guardando…';
  const fechaVal = $('#f-fecha').value || ahoraLocal();
  const fechaGuardar = fechaVal.slice(0,10);
  const mack = leerMack();

  if(editId){
    const n = D.nucleos.find(x=>x.id===editId); if(!n){ cerrarHoja(); return; }
    const nuevaFoto = await subirFoto(editId); if(nuevaFoto) n.foto=nuevaFoto;
    const ubicAnt = n.ubic;
    n.tipo=$('#f-tipo').value; n.marca=mayus($('#f-marca').value.trim()); n.modelo=mayus($('#f-modelo').value.trim());
    n.posicion=$('#f-posicion').value; n.serie=mayus($('#f-serie').value.trim());
    n.estado=mayus($('#f-estado').value.trim()); n.cars=leerCars();
    n.ubic=mayus($('#f-ubic').value.trim())||n.ubic; n.notas=mayus($('#f-notas').value.trim());
    n.fecha=fechaGuardar;
    if(mack && Object.values(mack).some(v=>v)) n.mack=mack;
    await persistir('nucleo', n);
    if(n.ubic!==ubicAnt) mov(editId, ubicAnt, n.ubic, 'Cambio de ubicación (edición)', fechaGuardar);
    cerrarHoja(); render(); pintarUbic(); return;
  }
  const tipo = $('#f-tipo').value;
  const id = await generarIdNucleo(tipo);
  const foto = await subirFoto(id);
  const ubic = mayus($('#f-ubic').value.trim())||'REC-01';
  const n = {
    id, tipo, fecha:fechaGuardar,
    marca:mayus($('#f-marca').value.trim()), modelo:mayus($('#f-modelo').value.trim()),
    posicion:$('#f-posicion').value, serie:mayus($('#f-serie').value.trim()),
    estado:mayus($('#f-estado').value.trim()), cars:leerCars(), foto,
    ubic, zona:'Recibido', resp:USUARIO?USUARIO.nombre:'', notas:mayus($('#f-notas').value.trim())
  };
  if(mack && Object.values(mack).some(v=>v)) n.mack=mack;
  D.nucleos.unshift(n); await persistir('nucleo', n);
  mov(id, 'INGRESO', ubic, 'REGISTRO DE NÚCLEO RECIBIDO', fechaGuardar);
  cerrarHoja(); tab='nucleos'; marcarTab(); render(); pintarUbic();
}

    `El núcleo ${id} saldrá de re-manufactura. Podrás elegir: Desmontarlo en partes, o devolverlo como Recibido.`,
    ()=>{
      abrirHoja(`
        <h2>DEVOLVER AL FLUJO <button class="x" onclick="cerrarHoja()">✕</button></h2>
        <div class="nota-origen">Núcleo <b>${esc(id)}</b> — selecciona el estado al que regresa.</div>
        <label>Estado</label>
        <select id="rv-zona">
          <option value="Recibido">Recibido — volver a evaluación</option>
          <option value="Desmontado">Desmontado — proceder a extraer partes</option>
          <option value="Scrap">Scrap — chatarra</option>
        </select>
        <label>Ubicación</label>
        <input id="rv-ubic" value="${esc(n.ubic)}" list="dl-ubic">
        <label>Motivo de devolución</label>
        <textarea id="rv-notas" rows="2" placeholder="REMANUFACTURA DEMASIADO COSTOSA…"></textarea>
        <label>Fecha</label>
        <input type="datetime-local" id="rv-fecha" value="${ahoraLocal()}">
        <button class="guardar" onclick="confirmarDevolucion('${id}')">Confirmar devolución</button>`);
    }
  );
}
async function confirmarDevolucion(id){
  const n = D.nucleos.find(x=>x.id===id); if(!n) return;
  const ubicAnt = n.ubic;
  n.zona = $('#rv-zona').value;
  n.ubic = mayus($('#rv-ubic').value.trim())||ubicAnt;
  const motivo = mayus($('#rv-notas').value.trim())||'DEVUELTO DEL PROCESO DE RE-MANUFACTURA';
  const fecha = $('#rv-fecha').value.slice(0,10)||hoy();
  delete n.zonaRemfg; delete n.precioRemfg; delete n.notasRemfg;
  await persistir('nucleo', n);
  mov(id, 'TALLER ZAPOTAL', n.ubic, motivo, fecha);
  cerrarHoja(); tab='nucleos'; marcarTab(); render(); pintarUbic();
  if(n.zona==='Desmontado') formParte(id);
}
function venderNucleoRemfg(id){
  const n = D.nucleos.find(x=>x.id===id); if(!n) return;
  abrirHoja(`
    <h2>💰 VENTA DE RE-MFG <button class="x" onclick="cerrarHoja()">✕</button></h2>
    <div class="nota-remfg">Registrando venta del núcleo re-manufacturado <b>${esc(id)}</b>.</div>
    <label>Precio de venta (Lps)</label>
    <input id="vr-precio" type="number" inputmode="numeric" placeholder="0">
    <label>Cliente / Referencia</label>
    <input id="vr-cliente" placeholder="NOMBRE O REFERENCIA DEL CLIENTE">
    <label>Fecha de venta</label>
    <input type="datetime-local" id="vr-fecha" value="${ahoraLocal()}">
    <label>Notas adicionales</label>
    <textarea id="vr-notas" rows="2"></textarea>
    <button class="guardar morado" onclick="confirmarVentaRemfg('${id}')">Confirmar venta</button>`);
}
async function confirmarVentaRemfg(id){
  const n = D.nucleos.find(x=>x.id===id); if(!n) return;
  const precio = $('#vr-precio').value;
  const cliente = mayus($('#vr-cliente').value.trim());
  const notas = mayus($('#vr-notas').value.trim());
  const fecha = $('#vr-fecha').value.slice(0,10)||hoy();
  n.zona='Vendido - Re-manufactura'; n.ventaRemfg={precio,cliente,fecha,notas};
  await persistir('nucleo', n);
  mov(id, n.ubic, 'VENTA RE-MFG', `VENDIDO A ${cliente} - L ${precio}`, fecha);
  cerrarHoja(); render();
  alert(`✓ Venta registrada.\nNúcleo ${id} vendido a ${cliente} por L ${Number(precio).toLocaleString()}`);
}

/* =====================================================================
   FORMULARIO PARTE
   ===================================================================== */
function formParte(origen){
  abrirHoja(`
    <h2>NUEVA PARTE <button class="x" onclick="cerrarHoja()">✕</button></h2>
    ${origen?`<div class="nota-origen">ORIGEN: NÚCLEO ${esc(origen)} — trazabilidad ligada.</div>`:''}
    ${bloqueFoto()}
    <label>Tipo de pieza</label>
    <input id="p-tipo" list="dl-piezas" placeholder="CORONA-PIÑÓN, COPLÍN, EJE PRINCIPAL…" oninput="onTipoParte(this.value)">
    ${origen?'':`<label>ID núcleo de origen (opcional)</label><input id="p-origen" placeholder="TR-2026-08-0001">`}
    <div class="fila2">
      <div><label>Condición</label>
        <select id="p-cond">
          <option>USADO - BUEN ESTADO</option><option>USADO - REGULAR</option>
          <option>REPARACIÓN REQUERIDA</option><option>NUEVO</option>
        </select>
      </div>
      <div><label>Precio sugerido (Lps)</label><input id="p-precio" type="number" inputmode="numeric"></div>
    </div>
    <label>Ubicación / estante</label><input id="p-ubic" list="dl-ubic" placeholder="A3-02-05, E22…">
    <label>Fecha</label>
    <input type="datetime-local" id="p-fecha" value="${ahoraLocal()}">
    ${camposCars(SUG['Corona-Piñón'])}
    ${bloqueModelos()}
    <label>Notas</label><textarea id="p-notas" rows="2"></textarea>
    <button class="guardar" onclick="guardarParte(this,'${origen||''}')">Guardar parte</button>`);
}
function onTipoParte(val){
  /* Mapear el tipo escrito al key de SUG correspondiente */
  const t = mayus(val.trim());
  const keyMap = {
    'COPLÍN':'Coplín', 'COPLIN':'Coplín',
    'CORONA-PIÑÓN':'Corona-Piñón','CORONA PIÑÓN':'Corona-Piñón','CORONA PINON':'Corona-Piñón',
    'EJE PRINCIPAL (MAINSHAFT)':'Eje Principal (Mainshaft)',
    'EJE CONTRAMARCHA (COUNTERSHAFT)':'Eje Contramarcha (Countershaft)',
    'EJE DE ENTRADA (INPUT SHAFT)':'Eje de Entrada (Input Shaft)',
    'ENGRANE':'Engrane','PORTADIFERENCIAL':'Portadiferencial','RODAMIENTO':'Rodamiento',
    'TRANSMISIÓN':'Transmisión','TRANSMISION':'Transmisión',
    'DIFERENCIAL':'Diferencial'
  };
  const sugKey = keyMap[t] || val;
  ponSug(sugKey);
}
async function guardarParte(btn, origen){
  btn.disabled=true; btn.textContent='Guardando…';
  /* ID secuencial consultando Supabase para evitar colisiones */
  const id = await generarIdParte();
  const foto = await subirFoto(id);
  const ubic = mayus($('#p-ubic').value.trim())||'DSM-01';
  const orig = origen || (mayus($('#p-origen')?.value.trim()||''));
  const fechaVal = $('#p-fecha').value || ahoraLocal();
  const fechaGuardar = fechaVal.slice(0,10);
  const modelos = leerModelos();
  const p = {
    id, origen:orig, tipo:mayus($('#p-tipo').value.trim())||'PIEZA',
    cond:$('#p-cond').value, precio:$('#p-precio').value,
    cars:leerCars(), foto, ubic, fecha:fechaGuardar, venta:'Disponible',
    resp:USUARIO?USUARIO.nombre:'', notas:mayus($('#p-notas').value.trim()),
    modelos
  };
  D.partes.unshift(p); await persistir('parte', p);
  mov(id, orig?('DESARME '+orig):'INGRESO', ubic, 'PARTE CLASIFICADA Y ALMACENADA', fechaGuardar);
  cerrarHoja(); tab='partes'; marcarTab(); render(); pintarUbic();
}

function formEditarParte(id){
  const e = D.partes.find(x=>x.id===id); if(!e) return;
  abrirHoja(`
    <h2>EDITAR ${esc(e.id)} <button class="x" onclick="cerrarHoja()">✕</button></h2>
    ${bloqueFoto()}
    <label>Tipo de pieza</label>
    <input id="p-tipo" list="dl-piezas" oninput="onTipoParte(this.value)">
    <div class="fila2">
      <div><label>Condición</label>
        <select id="p-cond">
          <option>USADO - BUEN ESTADO</option><option>USADO - REGULAR</option>
          <option>REPARACIÓN REQUERIDA</option><option>NUEVO</option>
        </select>
      </div>
      <div><label>Precio sugerido (Lps)</label><input id="p-precio" type="number" inputmode="numeric"></div>
    </div>
    <label>Ubicación / estante</label><input id="p-ubic" list="dl-ubic">
    <label>Fecha del movimiento</label>
    <input type="datetime-local" id="p-fecha" value="${e.fecha?e.fecha+'T00:00':ahoraLocal()}">
    ${camposCars([])}
    ${bloqueModelos(e.modelos||[])}
    <label>Notas</label><textarea id="p-notas" rows="2"></textarea>
    <button class="guardar" onclick="guardarEdicionParte(this,'${id}')">Guardar cambios</button>`);

  $('#p-tipo').value=e.tipo||''; $('#p-cond').value=e.cond||'USADO - BUEN ESTADO';
  $('#p-precio').value=e.precio||''; $('#p-ubic').value=e.ubic||''; $('#p-notas').value=e.notas||'';
  (e.cars||[]).slice(0,5).forEach((c,i)=>{ $('#cn'+i).value=c.n||''; $('#cv'+i).value=c.v||''; });
  if(e.foto){ const p=$('#foto-prev'); p.src=e.foto; p.style.display='block'; $('#fotobtn-txt').textContent='✓ Ya tiene foto'; }

  /* Precargar sugerencias de características según el tipo */
  onTipoParte(e.tipo||'');
}
async function guardarEdicionParte(btn, id){
  btn.disabled=true; btn.textContent='Guardando…';
  const p = D.partes.find(x=>x.id===id); if(!p){ cerrarHoja(); return; }
  const nuevaFoto = await subirFoto(id); if(nuevaFoto) p.foto=nuevaFoto;
  const ubicAnt = p.ubic;
  const fechaVal = $('#p-fecha').value||ahoraLocal();
  const fechaGuardar = fechaVal.slice(0,10);
  p.tipo=mayus($('#p-tipo').value.trim())||p.tipo; p.cond=$('#p-cond').value;
  p.precio=$('#p-precio').value; p.cars=leerCars();
  p.ubic=mayus($('#p-ubic').value.trim())||p.ubic; p.notas=mayus($('#p-notas').value.trim());
  p.fecha=fechaGuardar; p.modelos=leerModelos();
  await persistir('parte', p);
  if(p.ubic!==ubicAnt) mov(id, ubicAnt, p.ubic, 'CAMBIO DE UBICACIÓN (EDICIÓN)', fechaGuardar);
  cerrarHoja(); render(); pintarUbic();
}

/* verNucleoRemfg — alias que lleva a la pestaña de re-manufactura y hace scroll al núcleo */
function verNucleoRemfg(id){
  tab='remfg'; marcarTab(); render();
  setTimeout(()=>{
    const cards = document.querySelectorAll('#vista .card');
    for(const c of cards){ if(c.innerHTML.includes(id)){ c.scrollIntoView({behavior:'smooth',block:'center'}); break; } }
  }, 100);
}

/* =====================================================================
   ACCIONES EN NÚCLEOS
   ===================================================================== */
function desarmar(id){
  const n = D.nucleos.find(x=>x.id===id); if(!n) return;
  if(n.zona==='Re-manufactura'){
    alert('Este núcleo está en Re-manufactura. Usa "Devolver al flujo" para cambiar su estado antes de desmontarlo.');
    return;
  }
  pedirConfirm(
    '¿Desarmar núcleo?',
    `${id}: el núcleo pasará a "Desmontado" y podrás registrar sus partes. ¿Continuar?`,
    ()=>{
      n.zona='Desmontado'; persistir('nucleo', n);
      mov(id, n.ubic, n.ubic, 'INICIO DE DESARME — SE CONVIERTE EN PARTES');
      render(); formParte(id);
    }
  );
}

function formMover(id){
  const col = D.nucleos.find(x=>x.id===id)?'nucleo':'parte';
  const o = D.nucleos.find(x=>x.id===id)||D.partes.find(x=>x.id===id); if(!o) return;
  abrirHoja(`
    <h2>MOVER ${esc(id)} <button class="x" onclick="cerrarHoja()">✕</button></h2>
    <div class="meta" style="margin-bottom:8px">UBICACIÓN ACTUAL: <b>${esc(o.ubic)}</b></div>
    <label>Nueva ubicación</label>
    <input id="mv-ubic" list="dl-ubic" placeholder="A3-02, E22, TALLER ZAPOTAL…">
    <label>Motivo del traslado</label>
    <input id="mv-motivo" placeholder="TRASLADO EN BODEGA">
    <label>Fecha</label>
    <input type="datetime-local" id="mv-fecha" value="${ahoraLocal()}">
    <button class="guardar" onclick="confirmarMover('${id}','${col}')">Confirmar traslado</button>`);
}
async function confirmarMover(id, col){
  const o = col==='nucleo' ? D.nucleos.find(x=>x.id===id) : D.partes.find(x=>x.id===id);
  if(!o) return;
  const d = mayus($('#mv-ubic').value.trim()); if(!d){ alert('Escribe la ubicación destino.'); return; }
  const motivo = mayus($('#mv-motivo').value.trim())||'TRASLADO EN BODEGA';
  const fecha = $('#mv-fecha').value.slice(0,10)||hoy();
  mov(id, o.ubic, d, motivo, fecha);
  o.ubic=d; persistir(col, o); cerrarHoja(); render(); pintarUbic();
}

function marcarVendido(id){
  const p = D.partes.find(x=>x.id===id); if(!p) return;
  p.venta = p.venta==='Vendido'?'Disponible':'Vendido';
  if(p.venta==='Vendido') mov(id, p.ubic, 'VENTA', 'PARTE VENDIDA');
  persistir('parte', p); render();
}

function borrar(col, id){
  if(!puedeElim()){
    alert('Solo un Supervisor o Administrador puede eliminar registros.');
    return;
  }
  pedirConfirm(
    `¿Eliminar ${id}?`,
    `Esta acción no se puede deshacer. El registro "${id}" será eliminado permanentemente de la base de datos.`,
    async ()=>{
      D[col] = D[col].filter(x=>x.id!==id);
      await eliminar(id);
      /* Registrar el borrado en movimientos para auditoría */
      mov('AUDIT', USUARIO?USUARIO.nombre:'?', 'ELIMINADO', `Eliminó ${col.toUpperCase()}: ${id}`);
      render();
    }
  );
}

/* =====================================================================
   EXPORTAR CSV
   ===================================================================== */
const csvLinea = arr => arr.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')+'\n';
function exportar(){
  let s = '\uFEFFNÚCLEOS\n';
  s += csvLinea(['ID','Tipo','Posición','Fecha','Marca','Modelo','Serie','Estado','Car1','Car2','Car3','Car4','Car5','MACK-Ratio','MACK-TH-Flecha','MACK-TH-Coplín','Ubicación','Zona','Responsable','Foto','Notas']);
  D.nucleos.forEach(n=>{ const mk=n.mack||{};
    s+=csvLinea([n.id,n.tipo,n.posicion||'',n.fecha,n.marca,n.modelo,n.serie,n.estado,
      ...(n.cars||[]).map(c=>c.v?`${c.n}: ${c.v}`:'').concat(['','','','','']).slice(0,5),
      mk.ratio||'',mk.thFlecha||'',mk.thCoplin||'',n.ubic,n.zona,n.resp,(n.foto&&n.foto.startsWith('http'))?n.foto:'',n.notas]);
  });
  s+='\nPARTES\n';
  s+=csvLinea(['ID','Núcleo Origen','Tipo','Condición','Car1','Car2','Car3','Car4','Car5','Coplín-TH','Coplín-Cruz','Coplín-Pista','Corona-Ratio','Modelos Compatibles','Ubicación','Fecha','Precio (Lps)','Estado','Responsable','Foto','Notas']);
  D.partes.forEach(p=>{ const cp=p.coplin||{}; const cr=p.corona||{};
    s+=csvLinea([p.id,p.origen,p.tipo,p.cond,
      ...(p.cars||[]).map(c=>c.v?`${c.n}: ${c.v}`:'').concat(['','','','','']).slice(0,5),
      cp.th||'',cp.cruz||'',cp.pista||'',cr.ratio||'',(p.modelos||[]).join('; '),
      p.ubic,p.fecha,p.precio,p.venta,p.resp,(p.foto&&p.foto.startsWith('http'))?p.foto:'',p.notas]);
  });
  s+='\nMOVIMIENTOS\n';
  s+=csvLinea(['Fecha','ID/Ref','Origen','Destino','Motivo','Responsable']);
  D.movs.forEach(m=>s+=csvLinea([m.fecha,m.ref,m.origen,m.destino,m.motivo,m.resp]));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'}));
  a.download=`inventario_bodega_${hoy()}.csv`; a.click();
}

/* =====================================================================
   NAVEGACIÓN
   ===================================================================== */
function marcarTab(){ document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab)); }
document.querySelectorAll('nav button').forEach(b=> b.onclick=()=>{ tab=b.dataset.tab; limpiarFiltros(); marcarTab(); render(); });
$('#fab').onclick = ()=> tab==='partes' ? formParte('') : formNucleo();
$('#search').oninput = e=>{ filtro=e.target.value.toUpperCase(); render(); };
$('#recargar').onclick = ()=> cargar();
$('#hoja').onclick = e=>{ if(e.target.id==='hoja') cerrarHoja(); };
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && sb) cargar(false); });

cargar();
</script>
